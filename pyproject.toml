[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.1.0"
description = "A recurrent-depth (looped) transformer implemented from scratch in PyTorch — Prelude/Recurrent/Coda with fine-grained MoE, GQA attention, and LTI-constrained stable looping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Asher Khan" }]
keywords = [
    "transformer",
    "recurrent-depth",
    "looped-transformer",
    "mixture-of-experts",
    "gqa",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "torch>=2.1",
    "numpy",
    "datasets",
    "transformers",
    "tokenizers",
    "wandb",
    "tqdm",
]

[project.optional-dependencies]
# Development / testing.
dev = ["pytest", "ruff", "black", "mypy"]
# Optional inference fast path — install manually (not required on T4).
# flash-attn targets Ampere (sm80)+.
fast = ["flash-attn"]

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# Optional Ampere-only fast path; not installed on T4/CI and ships no stubs.
module = "flash_attn"
ignore_missing_imports = true
